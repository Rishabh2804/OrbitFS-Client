name: Release App Artifacts

on:
  push:
    branches:
      - main
      - master

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android Debug APK
        run: ./gradlew :composeApp:assembleDebug

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OrbitFS-Android-APK
          path: composeApp/build/outputs/apk/debug/composeApp-debug.apk

  build-desktop:
    name: Build Desktop App
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Desktop Package
        run: ./gradlew :composeApp:desktopJar

      - name: Upload Desktop Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OrbitFS-Desktop-JAR
          path: composeApp/build/libs/*.jar

  create-release:
    name: Create GitHub Release
    needs: [build-android, build-desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: OrbitFS-Android-APK
          path: release-artifacts/

      - name: Download Desktop Artifact
        uses: actions/download-artifact@v4
        with:
          name: OrbitFS-Desktop-JAR
          path: release-artifacts/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: OrbitFS Client Release v1.0.${{ github.run_number }}
          body: |
            ## OrbitFS Client Release v1.0.${{ github.run_number }}
            
            Automated build for Android and Desktop (macOS / Windows / Linux).
            
            ### Included Artifacts
            - **Android APK:** `composeApp-debug.apk`
            - **Desktop App:** `composeApp-desktop.jar`
          files: |
            release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
